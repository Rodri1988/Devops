name: CI/CD Pipeline Innovatech

on:
  push:
    branches: [ "main" ] # Se activa cuando subes algo a la rama main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build y Push Backend Ventas
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/back-ventas ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push ${{ steps.login-ecr.outputs.registry }}/back-ventas

      - name: Build y Push Frontend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/front-tienda ./front_despacho
          docker push ${{ steps.login-ecr.outputs.registry }}/front-tienda
