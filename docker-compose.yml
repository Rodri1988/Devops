version: '3.8'

services:
  # Capa de Datos: MySQL
  db:
    image: mysql:8.0
    container_name: tienda-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: tienda_perritos
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql # REQUISITO: Persistencia de datos

  # Capa de Lógica: Backend Ventas
  backend-ventas:
    build: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: back-ventas
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db # Uso de DNS interno de Docker
      - DB_USER=root
      - DB_PASSWORD=admin123
    depends_on:
      - db

  # Capa de Presentación: Frontend
  frontend:
    build: ./front_despacho
    container_name: front-tienda
    ports:
      - "80:80"
    depends_on:
      - backend-ventas

# Definición del volumen para la persistencia (IE9)
volumes:
  db_data:
